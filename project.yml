name: Fitness
options:
  bundleIdPrefix: com.xsj
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.xsj.Fitness
targets:
  Fitness:
    type: application
    platform: iOS
    sources:
      - path: Fitness
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
